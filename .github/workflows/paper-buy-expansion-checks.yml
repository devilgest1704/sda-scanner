name: Paper BUY expansion checks
on:
  pull_request:
    paths:
      - 'v30_pump_hunter.py'
      - 'engine_legacy.py'
      - 'tests/test_paper_exit_ownership.py'
      - 'tests/test_paper_fresh_momentum_thresholds.py'
      - 'tests/test_tp4_paper.py'
      - '.github/workflows/scanner_v18.yml'
      - '.github/workflows/paper-buy-expansion-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  paper-buy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile paper BUY logic
        run: python -m py_compile v30_pump_hunter.py tests/test_paper_fresh_momentum_thresholds.py
      - name: Verify experimental thresholds and preserved risk gates
        run: python -m unittest discover -s tests -p 'test_paper_fresh_momentum_thresholds.py' -v

      - name: Verify TP4 PAPER exit lifecycle
        run: python -m unittest discover -s tests -p 'test_tp4_paper.py' -v

      - name: Verify strategy owns all PAPER exits
        run: |
          pip install requests
          python -m unittest discover -s tests -p test_paper_exit_ownership.py -v
