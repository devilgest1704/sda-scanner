name: PAPER Risk Diagnostics (read-only)
on:
  pull_request:
    paths:
      - 'tools/paper_risk_diagnostics.py'
      - 'tests/test_paper_risk_diagnostics.py'
      - '.github/workflows/paper_risk_diagnostics.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile diagnostics and tests
        run: python -m py_compile tools/paper_risk_diagnostics.py tests/test_paper_risk_diagnostics.py
      - name: Run regression tests
        run: python -m unittest discover -s tests -p test_paper_risk_diagnostics.py -v
      - name: Produce read-only diagnostic report
        run: python tools/paper_risk_diagnostics.py
