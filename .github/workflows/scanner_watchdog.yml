name: SDA Scanner Watchdog

on:
  push:
    branches:
      - main
  # Recover immediately when the long-running scanner finishes, times out,
  # or is cancelled for a source/config refresh. Scheduled jobs can be delayed
  # or missed, so polling must not be our only automatic recovery trigger.
  workflow_run:
    workflows:
      - SDA Scanner V18
    types:
      - completed
  schedule:
    # Secondary safety net for missed workflow_run events or unstarted workers.
    - cron: '2-59/5 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: sda-scanner-watchdog
  cancel-in-progress: true

jobs:
  dispatch-scanner:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Dispatch scanner only when no worker is active
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # The scanner itself is a long-lived 60s worker. This watchdog
          # recovers a stopped worker after completion events and via cron.
          # Do not create queued/pending scanner runs while one is already
          # active (or another dispatch is waiting for the concurrency slot).
          active_or_pending="$(timeout 30s gh run list \
            --workflow scanner_v18.yml \
            --repo "${{ github.repository }}" \
            --branch main \
            --limit 20 \
            --json status \
            --jq '[.[] | select(.status == "in_progress" or .status == "queued" or .status == "pending" or .status == "waiting" or .status == "requested")] | length')"

          echo "Scanner active/pending runs: ${active_or_pending}"

          # A long-lived worker checks out source and paper Champion settings once.
          # If watched execution code OR paper-only champion config changes,
          # restart an older worker after a grace period so changes to the
          # hourly missed-pump learner and other research/entry code take effect.
          # Do not cancel fresh workers or workers already shutting down.
          active_run="$(timeout 30s gh run list --workflow scanner_v18.yml \
            --repo "${{ github.repository }}" --branch main --limit 20 \
            --json databaseId,status,headSha,createdAt \
            --jq '[.[] | select(.status == "in_progress")] | .[0] // empty')"
          if [ -n "$active_run" ]; then
            run_id="$(echo "$active_run" | jq -r '.databaseId')"
            run_sha="$(echo "$active_run" | jq -r '.headSha')"
            run_created="$(echo "$active_run" | jq -r '.createdAt')"
            run_age=$(( $(date -u +%s) - $(date -u -d "$run_created" +%s) ))
            if [ "$run_age" -ge 1200 ]; then
              # Shallow partial fetch avoids downloading many megabytes of
              # historical paper-state blobs on each watchdog run.
              if timeout 45s git fetch -q --filter=blob:none --depth=1 origin "$run_sha"; then
                current_sources="$(git rev-parse HEAD:main.py HEAD:v30_pump_hunter.py HEAD:run_scanner_v18.sh HEAD:tools/candidate_price_tracker.py HEAD:tools/forward_shadow_agent.py HEAD:tools/strategy_evolution_agent.py HEAD:tools/missed_pump_learning.py HEAD:technical_analysis.py HEAD:tools/v32_hourly_macd.py HEAD:v30_agent_config.json)"
                worker_sources="$(git rev-parse "$run_sha:main.py" "$run_sha:v30_pump_hunter.py" "$run_sha:run_scanner_v18.sh" "$run_sha:tools/candidate_price_tracker.py" "$run_sha:tools/forward_shadow_agent.py" "$run_sha:tools/strategy_evolution_agent.py" "$run_sha:tools/missed_pump_learning.py" "$run_sha:technical_analysis.py" "$run_sha:tools/v32_hourly_macd.py" "$run_sha:v30_agent_config.json" 2>/dev/null || true)"
                # A watched source newly added to main is absent from the old
                # worker commit. That is a source change too; never treat an
                # empty/missing worker fingerprint as "same version".
                if [ -z "$worker_sources" ] || [ "$current_sources" != "$worker_sources" ]; then
                  echo "Worker $run_id has outdated source; requesting controlled replacement."
                  timeout 30s gh run cancel "$run_id" --repo "${{ github.repository }}"
                  # Wait for GitHub to confirm that the prior paper writer
                  # has stopped before dispatching. Leaving immediately here
                  # created multi-hour gaps when scheduled workflows stalled.
                  old_status=""
                  # GitHub occasionally takes >60s to finish cancelling
                  # a blocked worker. Wait up to 96s rather than exiting
                  # just before it stops and leaving scanner downtime.
                  for poll in $(seq 1 24); do
                    sleep 4
                    old_status="$(timeout 15s gh run view "$run_id" \
                      --repo "${{ github.repository }}" --json status --jq '.status' || true)"
                    echo "Old scanner $run_id: ${old_status:-unknown} (check $poll/24)"
                    if [ "$old_status" = "completed" ]; then
                      break
                    fi
                  done
                  if [ "$old_status" != "completed" ]; then
                    echo "::warning::Old scanner has not stopped; refusing overlapping writers."
                    exit 0
                  fi
                  # Recheck any new worker that may have been dispatched by
                  # the workflow_run recovery event while we were waiting.
                  active_or_pending="$(timeout 30s gh run list \
                    --workflow scanner_v18.yml --repo "${{ github.repository }}" \
                    --branch main --limit 20 --json status \
                    --jq '[.[] | select(.status == "in_progress" or .status == "queued" or .status == "pending" or .status == "waiting" or .status == "requested")] | length')"
                  echo "After stopping old worker: active/pending runs = ${active_or_pending}"
                  # Fall through to the normal dispatch block if it is zero.
                fi
              else
                echo "::warning::Could not inspect old scanner source within 45s; will retry later."
              fi
            fi
          fi

          if [ "${active_or_pending}" -gt 0 ]; then
            echo 'Scanner worker already active/pending; watchdog will not dispatch another run.'
            exit 0
          fi

          for attempt in 1 2 3; do
            echo "Dispatch attempt ${attempt}/3"
            if timeout 30s gh workflow run scanner_v18.yml \
              --repo "${{ github.repository }}" \
              --ref main \
              -f run_reason=watchdog; then
              echo 'Scanner workflow dispatched by watchdog.'
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              sleep 10
            fi
          done

          echo 'Scanner dispatch failed after 3 attempts.'
          exit 1
