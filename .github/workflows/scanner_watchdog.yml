name: SDA Scanner Watchdog

on:
  push:
    branches:
      - main
  schedule:
    # Run off the top of the hour to reduce GitHub scheduler congestion.
    - cron: '2-59/5 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: sda-scanner-watchdog
  cancel-in-progress: true

jobs:
  dispatch-scanner:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Dispatch scanner only when no worker is active
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # The scanner itself is now a long-lived 60s worker. The watchdog is
          # only a recovery mechanism for the case where that worker ended.
          # Do not create queued/pending scanner runs while one is already
          # active (or another dispatch is waiting for the concurrency slot).
          active_or_pending="$(timeout 30s gh run list \
            --workflow scanner_v18.yml \
            --repo "${{ github.repository }}" \
            --branch main \
            --limit 20 \
            --json status \
            --jq '[.[] | select(.status == "in_progress" or .status == "queued" or .status == "pending" or .status == "waiting" or .status == "requested")] | length')"

          echo "Scanner active/pending runs: ${active_or_pending}"

          # A long-lived worker checks out source and paper Champion settings once.
          # If watched execution code OR paper-only champion config changes,
          # restart an older worker after a grace
          # period so new diagnostics/bug fixes actually take effect.
          # Do not cancel fresh workers or workers already shutting down.
          active_run="$(timeout 30s gh run list --workflow scanner_v18.yml \
            --repo "${{ github.repository }}" --branch main --limit 20 \
            --json databaseId,status,headSha,createdAt \
            --jq '[.[] | select(.status == "in_progress")] | .[0] // empty')"
          if [ -n "$active_run" ]; then
            run_id="$(echo "$active_run" | jq -r '.databaseId')"
            run_sha="$(echo "$active_run" | jq -r '.headSha')"
            run_created="$(echo "$active_run" | jq -r '.createdAt')"
            run_age=$(( $(date -u +%s) - $(date -u -d "$run_created" +%s) ))
            if [ "$run_age" -ge 1200 ]; then
              # Shallow partial fetch avoids downloading many megabytes of
              # historical paper-state blobs on each watchdog run.
              if timeout 45s git fetch -q --filter=blob:none --depth=1 origin "$run_sha"; then
                current_sources="$(git rev-parse HEAD:main.py HEAD:v30_pump_hunter.py HEAD:run_scanner_v18.sh HEAD:tools/candidate_price_tracker.py HEAD:tools/forward_shadow_agent.py HEAD:v30_agent_config.json)"
                worker_sources="$(git rev-parse "$run_sha:main.py" "$run_sha:v30_pump_hunter.py" "$run_sha:run_scanner_v18.sh" "$run_sha:tools/candidate_price_tracker.py" "$run_sha:tools/forward_shadow_agent.py" "$run_sha:v30_agent_config.json" 2>/dev/null || true)"
                if [ -n "$worker_sources" ] && [ "$current_sources" != "$worker_sources" ]; then
                  echo "Worker $run_id has outdated source; requesting controlled replacement."
                  timeout 30s gh run cancel "$run_id" --repo "${{ github.repository }}"
                  # The next watchdog checks that the old worker stopped
                  # before dispatching. It must never overlap paper writers.
                  exit 0
                fi
              else
                echo "::warning::Could not inspect old scanner source within 45s; will retry later."
              fi
            fi
          fi

          if [ "${active_or_pending}" -gt 0 ]; then
            echo 'Scanner worker already active/pending; watchdog will not dispatch another run.'
            exit 0
          fi

          for attempt in 1 2 3; do
            echo "Dispatch attempt ${attempt}/3"
            if timeout 30s gh workflow run scanner_v18.yml \
              --repo "${{ github.repository }}" \
              --ref main \
              -f run_reason=watchdog; then
              echo 'Scanner workflow dispatched by watchdog.'
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              sleep 10
            fi
          done

          echo 'Scanner dispatch failed after 3 attempts.'
          exit 1
