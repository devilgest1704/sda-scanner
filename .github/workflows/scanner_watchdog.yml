name: SDA Scanner Watchdog

on:
  schedule:
    # Run off the top of the hour to reduce GitHub scheduler congestion.
    - cron: '2-59/5 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: sda-scanner-watchdog
  cancel-in-progress: false

jobs:
  dispatch-scanner:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Deploy code changes to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_Ni66yEoQsvqh6CTUt6YjXqlv
          VERCEL_PROJECT_ID: prj_nolTVKgPkLHUv9vOYvNE9xd1VRv6
        run: |
          set -euo pipefail
          MESSAGE="$(git log -1 --pretty=%s)"
          echo "HEAD message: $MESSAGE"

          if [ "$MESSAGE" = "Update SDA scanner state" ]; then
            echo 'State-only commit detected; Vercel deploy skipped.'
          elif [ -z "$VERCEL_TOKEN" ]; then
            echo 'WARNING: GitHub Actions secret VERCEL_TOKEN is missing; Vercel deploy skipped.'
          else
            npm install --global vercel@latest
            vercel link --yes \
              --project="$VERCEL_PROJECT_ID" \
              --scope="$VERCEL_ORG_ID" \
              --token="$VERCEL_TOKEN"
            vercel deploy --prod --yes \
              --scope="$VERCEL_ORG_ID" \
              --token="$VERCEL_TOKEN"
          fi

      - name: Dispatch scanner with retry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          for attempt in 1 2 3; do
            echo "Dispatch attempt ${attempt}/3"
            if gh workflow run scanner_v18.yml \
              --repo "${{ github.repository }}" \
              --ref main \
              -f run_reason=watchdog; then
              echo 'Scanner workflow dispatched by watchdog.'
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              sleep 10
            fi
          done

          echo 'Scanner dispatch failed after 3 attempts.'
          exit 1
