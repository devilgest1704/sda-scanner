name: SDA Scanner

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: sda-scanner-paper
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run whale scanner
        run: python whale_scanner.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
      - name: Prepare market scanner V18 activity filter
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("market_scanner.py"); s=p.read_text(encoding="utf-8")
          old='''        "active": (\n            window_1h["total_volume"] >= MIN_RECENT_VOLUME_SDA\n            and window_1h["transactions"] >= MIN_RECENT_TRADES\n        ),'''
          new='''        # Active means at least 250 SDA traded during the last hour.\n        # Trade count is intentionally NOT part of the activity filter.\n        "active": window_1h["total_volume"] >= MIN_RECENT_VOLUME_SDA,'''
          if old not in s: raise SystemExit("Expected market activity block not found")
          p.write_text(s.replace(old,new,1),encoding="utf-8")
          PY
          python -m py_compile market_scanner.py
      - name: Run market scanner
        run: python market_scanner.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
      - name: Update token metadata
        run: python token_metadata.py
      - name: Run liquidity scanner
        run: python liquidity_scanner.py
      - name: Prepare V18 autonomous paper trading configuration
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("main.py"); s=p.read_text(encoding="utf-8")
          s=s.replace("engine.BUY_THRESHOLD = 75\nengine.MIN_TRADES_1H = 3\nengine.MAX_NEW_BUYS_PER_RUN = 1", "engine.BUY_THRESHOLD = 75\nengine.MIN_TRADES_1H = 3\nengine.MAX_NEW_BUYS_PER_RUN = 5\nengine.MAX_OPEN_POSITIONS = 10", 1)
          old='''    lines += [f"Matched sells: {int(_n(portfolio.get('matched_sell_count')))}  •  Excluded unmatched: {int(_n(portfolio.get('excluded_unmatched_sell_count')))}", "", "🧭 POSITION ACTION", "", "ℹ️ Token names from Blockscout metadata.", "ℹ️ Invalid/inconsistent prices are UNKNOWN — never a fake loss.", "🔒 Wallet is READ-ONLY."]'''
          new='''    lines += [f"Matched sells: {int(_n(portfolio.get('matched_sell_count')))}  •  Excluded unmatched: {int(_n(portfolio.get('excluded_unmatched_sell_count')))}", "", "🧭 POSITION ACTION"]
    def _strength(score):
        s=_n(score)
        if s < 20: return "VERY WEAK"
        if s < 40: return "WEAK"
        if s < 60: return "NEUTRAL"
        if s < 75: return "GOOD"
        return "STRONG"
    for r in recommendations:
        action=r.get("action")
        icon="🔴" if action=="SELL / EXIT" else ("🟠" if action=="PARTIAL SELL" else ("🟢" if action=="HOLD / TRAIL" else "🟡"))
        p=r.get("pnl_sda"); pt=f"{_n(p):+.2f} SDA" if p is not None else "UNKNOWN"
        score=int(_n(r.get("score")))
        lines.append(f"{icon} {r['symbol']}: {action}  •  P/L {pt}  •  score {score}/100 — {_strength(score)}")
    lines += ["", "ℹ️ Score: 0–19 VERY WEAK • 20–39 WEAK • 40–59 NEUTRAL • 60–74 GOOD • 75–100 STRONG", "ℹ️ Token names from Blockscout metadata.", "ℹ️ Invalid/inconsistent prices are UNKNOWN — never a fake loss.", "🔒 Wallet is READ-ONLY."]'''
          if old in s: s=s.replace(old,new,1)
          elif "Score: 0–19 VERY WEAK" not in s: raise SystemExit("Expected portfolio message block not found")
          p.write_text(s,encoding="utf-8")
          PY
          python -m py_compile main.py engine.py
      - name: Run SDA main engine V18 AUTO PAPER
        run: python main.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
      - name: Calculate paper trading statistics
        run: python paper_stats.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
      - name: Ensure JSON state files exist
        run: |
          touch state.json whale_state.json whale_data.json whale_history.json portfolio_data.json market_data.json token_metadata.json liquidity_data.json paper_stats.json sidra_swap_discovery.json pending_signals.json positions.json wallet_data.json decision_state_v15.json paper_auto_state.json
      - name: Validate JSON state files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          files="state.json whale_state.json whale_data.json whale_history.json portfolio_data.json market_data.json token_metadata.json liquidity_data.json paper_stats.json sidra_swap_discovery.json pending_signals.json positions.json wallet_data.json decision_state_v15.json paper_auto_state.json".split()
          for name in files:
              p=Path(name)
              if not p.exists() or p.stat().st_size==0: p.write_text("{}\n",encoding="utf-8"); continue
              try: json.loads(p.read_text(encoding="utf-8"))
              except Exception: p.write_text("{}\n",encoding="utf-8")
          PY
      - name: Commit scanner state
        run: |
          git config user.name "sda-scanner-bot"
          git config user.email "scanner@github.local"
          git add main.py state.json whale_state.json whale_data.json market_data.json token_metadata.json liquidity_data.json paper_stats.json sidra_swap_discovery.json pending_signals.json positions.json wallet_data.json decision_state_v15.json whale_history.json portfolio_data.json paper_auto_state.json
          if git diff --staged --quiet; then echo "No state changes to commit."; else git commit -m "Update SDA scanner state"; git push origin main; fi
