name: SDA Scanner

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: sda-scanner-paper
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run whale scanner
        run: python whale_scanner.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}

      - name: Run market scanner
        run: python market_scanner.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}

      - name: Update token metadata
        run: python token_metadata.py

      - name: Prepare liquidity scanner compatibility fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("liquidity_scanner.py")
          s = p.read_text(encoding="utf-8")
          s = s.replace('"token_decimals": token_out["decimals"] if token_out else None,', '"token_decimals": token_out.get("decimals") if token_out else None,', 1)
          s = s.replace('bool(discovery.get("v25_50_sda_quote_probe", {}).get("ok"))', 'bool((discovery.get("v25_50_sda_quote_probe") or {}).get("ok"))', 1)
          marker = '    transfers = receipt_erc20_transfers(h)\n    if not transfers:\n        transfers = transfers_for_tx(h)\n'
          enrichment = '''    transfers = receipt_erc20_transfers(h)\n    if not transfers:\n        transfers = transfers_for_tx(h)\n    metadata = load_json("token_metadata.json", {})\n    if isinstance(metadata, dict):\n        for t in transfers:\n            a = addr(t.get("token_address"))\n            meta = metadata.get(a) or metadata.get(a.lower())\n            if isinstance(meta, dict) and meta.get("decimals") is not None and t.get("raw_value") is not None:\n                try:\n                    d = int(meta.get("decimals"))\n                    if 0 <= d <= 36:\n                        t["decimals"] = d\n                        t["value"] = float(Decimal(t["raw_value"]) / (Decimal(10) ** d))\n                except Exception:\n                    pass\n'''
          if marker in s and 'metadata = load_json("token_metadata.json", {})' not in s:
              s = s.replace(marker, enrichment, 1)
          p.write_text(s, encoding="utf-8")
          PY
          python -m py_compile liquidity_scanner.py main.py engine.py

      - name: Run liquidity scanner
        run: python liquidity_scanner.py

      - name: Prepare V18 autonomous paper trading configuration
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("main.py")
          s = p.read_text(encoding="utf-8")
          s = s.replace("engine.BUY_THRESHOLD = 75\nengine.MIN_TRADES_1H = 3\nengine.MAX_NEW_BUYS_PER_RUN = 1", "engine.BUY_THRESHOLD = 75\nengine.MIN_TRADES_1H = 3\nengine.MAX_NEW_BUYS_PER_RUN = 5\nengine.MAX_OPEN_POSITIONS = 10", 1)
          p.write_text(s, encoding="utf-8")

          e = Path("engine.py")
          s = e.read_text(encoding="utf-8")
          old = '        state[a]={"neg":neg,"weak":weak}\n        if weak>=2 and not pos.get("tp1_hit"):\n            z=close(p,a,cur,"AUTO PARTIAL SELL",.5)\n            if z:events.append(f"🟠 AUTO PARTIAL SELL {z[\'label\']}\\n\\nPrice: {price(cur)} SDA\\nClosed: 50%\\nProfit: {z[\'closed_profit_sda\']:+.2f} SDA\\nScore: {c:.0f}/100\\nMode: PAPER AUTO")'
          new = '        partial_done=bool(old.get("partial_done",False))\n        state[a]={"neg":neg,"weak":weak,"partial_done":partial_done}\n        if weak>=2 and not pos.get("tp1_hit") and not partial_done:\n            z=close(p,a,cur,"AUTO PARTIAL SELL",.5)\n            if z:\n                state[a]["partial_done"]=True\n                events.append(f"🟠 AUTO PARTIAL SELL {z[\'label\']}\\n\\nPrice: {price(cur)} SDA\\nClosed: 50%\\nProfit: {z[\'closed_profit_sda\']:+.2f} SDA\\nScore: {c:.0f}/100\\nMode: PAPER AUTO")'
          if old not in s:
              raise SystemExit("Expected V18 auto-exit block not found")
          s = s.replace(old, new, 1)
          e.write_text(s, encoding="utf-8")
          PY
          python -m py_compile main.py engine.py

      - name: Run SDA main engine V18 AUTO PAPER
        run: python main.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}

      - name: Calculate paper trading statistics
        run: python paper_stats.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}

      - name: Ensure JSON state files exist
        run: |
          touch state.json whale_state.json whale_data.json whale_history.json portfolio_data.json market_data.json token_metadata.json liquidity_data.json paper_stats.json sidra_swap_discovery.json pending_signals.json positions.json wallet_data.json decision_state_v15.json paper_auto_state.json

      - name: Validate JSON state files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          files = "state.json whale_state.json whale_data.json whale_history.json portfolio_data.json market_data.json token_metadata.json liquidity_data.json paper_stats.json sidra_swap_discovery.json pending_signals.json positions.json wallet_data.json decision_state_v15.json paper_auto_state.json".split()
          for name in files:
              p = Path(name)
              if not p.exists() or p.stat().st_size == 0:
                  p.write_text("{}\n", encoding="utf-8")
                  continue
              try:
                  json.loads(p.read_text(encoding="utf-8"))
              except Exception as e:
                  backup = p.with_suffix(p.suffix + ".invalid")
                  p.replace(backup)
                  p.write_text("{}\n", encoding="utf-8")
                  print("REPAIRED INVALID JSON:", name, e)
          PY

      - name: Commit scanner state
        run: |
          git config user.name "sda-scanner-bot"
          git config user.email "scanner@github.local"
          git add state.json whale_state.json whale_data.json market_data.json token_metadata.json liquidity_data.json paper_stats.json sidra_swap_discovery.json pending_signals.json positions.json wallet_data.json decision_state_v15.json whale_history.json portfolio_data.json paper_auto_state.json
          if git diff --staged --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "Update SDA scanner state"
            git push origin main
          fi
