name: SDA Scanner

on:
  workflow_dispatch:
  schedule:
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: ${{ github.ref }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run whale scanner
        run: python whale_scanner.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}

      - name: Run market scanner
        run: python market_scanner.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}

      - name: Update token metadata
        run: python token_metadata.py

      - name: Run liquidity scanner
        run: python liquidity_scanner.py

      - name: Run paper trading engine v12
        run: python main_v12.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}

      - name: Ensure state files exist
        run: |
          touch state.json whale_state.json whale_data.json whale_history.json portfolio_data.json
          touch market_data.json token_metadata.json liquidity_data.json
          touch sidra_swap_discovery.json pending_signals.json positions.json wallet_data.json
          touch decision_state_v12.json

      - name: Validate JSON state
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          files = [
            "state.json","whale_state.json","whale_data.json","whale_history.json","portfolio_data.json",
            "market_data.json","token_metadata.json","liquidity_data.json",
            "sidra_swap_discovery.json","pending_signals.json","positions.json","wallet_data.json",
            "decision_state_v12.json"
          ]
          for name in files:
              p=Path(name)
              if not p.exists():
                  print("SKIP:",name); continue
              with p.open(encoding="utf-8") as f: json.load(f)
              print("OK:",name)
          PY

      - name: Show open paper positions
        run: |
          python - <<'PY'
          import json
          try:
              with open("positions.json",encoding="utf-8") as f: data=json.load(f)
          except Exception as e:
              print("Could not read positions.json:",e); raise SystemExit(0)
          positions=data.get("positions",{})
          print("========== OPEN PAPER POSITIONS ==========")
          if not positions:
              print("No open paper positions.")
          else:
              for address,p in positions.items():
                  print(p.get("label",address))
                  print("  Entry:",p.get("entry_price"))
                  print("  TP1:",p.get("tp1"))
                  print("  TP2:",p.get("tp2"))
                  print("  SL:",p.get("sl"))
                  print("  Investment:",p.get("investment_sda"))
                  print("  Confidence:",p.get("entry_confidence"))
          print("===========================================")
          PY

      - name: Commit state files
        run: |
          git config user.name "sda-scanner-bot"
          git config user.email "scanner@github.local"
          git add state.json whale_state.json whale_data.json whale_history.json portfolio_data.json \
            market_data.json token_metadata.json liquidity_data.json sidra_swap_discovery.json \
            pending_signals.json positions.json wallet_data.json decision_state_v12.json
          if git diff --staged --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "Update SDA scanner state"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
