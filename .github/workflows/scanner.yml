name: SDA Scanner

on:
  workflow_dispatch:
  schedule:
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run whale scanner
        run: python whale_scanner.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}

      - name: Run market scanner
        run: python market_scanner.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}

      - name: Update token metadata
        run: python token_metadata.py

      - name: Discover token icons
        run: python token_icons.py

      - name: Persist V16 source fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("main.py"); s=p.read_text(encoding="utf-8")
          s=s.replace("{(_n(val):.2f) if val is not None else 'UNKNOWN'}","{f'{_n(val):.2f}' if val is not None else 'UNKNOWN'}",1)
          p.write_text(s,encoding="utf-8")
          p=Path("engine.py"); s=p.read_text(encoding="utf-8")
          old='pos["tp1_hit"]=True;pos["remaining_fraction"]=num(pos.get("remaining_fraction",1))-frac;pos["sl"]=e'
          new='pos["tp1_hit"]=True;pos["remaining_fraction"]=num(pos.get("remaining_fraction",1))-frac;pos["sl"]=max(e*(1+FEE_RATE)/((1-SLIPPAGE_RATE)*(1-FEE_RATE)),e)'
          s=s.replace(old,new,1)
          old='        if cur>=num(pos.get("tp2")):\n'
          new='''        # V16: after TP1, protect the remaining half at net breakeven and trail upward.\n        if pos.get("tp1_hit") and num(pos.get("remaining_fraction",0)) > 0 and cur > 0:\n            net_breakeven=e*(1+FEE_RATE)/((1-SLIPPAGE_RATE)*(1-FEE_RATE)) if e>0 else e\n            trailing=cur*(1-SL_PCT)\n            pos["sl"]=max(num(pos.get("sl")),net_breakeven,trailing)\n\n        if cur>=num(pos.get("tp2")):\n'''
          if old in s and 'trailing=cur*(1-SL_PCT)' not in s: s=s.replace(old,new,1)
          s=s.replace('reason="BREAKEVEN" if pos.get("tp1_hit") else "SL"','reason="PROTECTED SL" if pos.get("tp1_hit") else "SL"',1)
          s=s.replace('🔒 Remaining 50% protected at breakeven','🔒 Remaining 50% protected at fee-adjusted breakeven + trailing stop',1)
          p.write_text(s,encoding="utf-8")
          PY
          python -m py_compile main.py engine.py
          git config user.name "sda-scanner-bot"
          git config user.email "scanner@github.local"
          git add main.py engine.py
          if ! git diff --staged --quiet; then git commit -m "Fix V16 position protection and trailing stop"; git push origin main; fi

      - name: Prepare liquidity scanner fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("liquidity_scanner.py"); s=p.read_text(encoding="utf-8")
          s=s.replace('"token_decimals": token_out["decimals"] if token_out else None,','"token_decimals": token_out.get("decimals") if token_out else None,',1)
          s=s.replace('bool(discovery.get("v25_50_sda_quote_probe", {}).get("ok"))','bool((discovery.get("v25_50_sda_quote_probe") or {}).get("ok"))',1)
          # receipt logs do not carry decimals; enrich every decoded transfer from token_metadata.json.\n          marker='''    transfers = receipt_erc20_transfers(h)\n    if not transfers:\n        transfers = transfers_for_tx(h)\n'''
          replacement='''    transfers = receipt_erc20_transfers(h)\n    if not transfers:\n        transfers = transfers_for_tx(h)\n    # Resolve token decimals from the scanner's authoritative Blockscout metadata.\n    metadata = load_json("token_metadata.json", {})\n    if isinstance(metadata, dict):\n        for t in transfers:\n            a = addr(t.get("token_address"))\n            meta = metadata.get(a) or metadata.get(a.lower())\n            if isinstance(meta, dict) and meta.get("decimals") is not None:\n                try:\n                    d = int(meta.get("decimals"))\n                    if 0 <= d <= 36 and t.get("raw_value") is not None:\n                        t["decimals"] = d\n                        t["value"] = float(Decimal(t["raw_value"]) / (Decimal(10) ** d))\n                except Exception:\n                    pass\n'''
          if marker in s and 'authoritative Blockscout metadata' not in s:
              s=s.replace(marker,replacement,1)
              print("Added token decimals enrichment")
          p.write_text(s,encoding="utf-8")
          PY
          python -m py_compile liquidity_scanner.py

      - name: Run liquidity scanner
        run: python liquidity_scanner.py

      - name: Run SDA main engine V16
        run: python main.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}

      - name: Generate REAL PORTFOLIO card with token icons
        run: python portfolio_card.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}

      - name: Calculate paper trading statistics
        run: python paper_stats.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}

      - name: Validate JSON state
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          files=["state.json","whale_state.json","whale_data.json","whale_history.json","portfolio_data.json","market_data.json","token_metadata.json","liquidity_data.json","paper_stats.json","sidra_swap_discovery.json","pending_signals.json","positions.json","wallet_data.json","decision_state_v15.json"]
          for name in files:
              p=Path(name)
              if not p.exists() or p.stat().st_size==0:
                  p.write_text("{}\n",encoding="utf-8"); print("INITIALIZED:",name); continue
              try:
                  json.loads(p.read_text(encoding="utf-8")); print("OK:",name)
              except (json.JSONDecodeError,UnicodeDecodeError) as e:
                  b=p.with_suffix(p.suffix+".invalid"); p.replace(b); p.write_text("{}\n",encoding="utf-8"); print("REPAIRED:",name,e)
          PY

      - name: Show open paper positions
        run: |
          python - <<'PY'
          import json
          try: d=json.load(open("positions.json",encoding="utf-8"))
          except Exception as e: print(e); raise SystemExit(0)
          ps=d.get("positions",{})
          print("========== OPEN PAPER POSITIONS ==========")
          for a,p in ps.items():
              print(p.get("label",a),"Entry",p.get("entry_price"),"TP1",p.get("tp1"),"TP2",p.get("tp2"),"SL",p.get("sl"),"Remaining",p.get("remaining_fraction"),"TP1 hit",p.get("tp1_hit"))
          if not ps: print("No open paper positions.")
          print("===========================================")

      - name: Commit state files
        run: |
          git config user.name "sda-scanner-bot"
          git config user.email "scanner@github.local"
          git add state.json whale_state.json whale_data.json whale_history.json portfolio_data.json market_data.json token_metadata.json liquidity_data.json paper_stats.json sidra_swap_discovery.json pending_signals.json positions.json wallet_data.json decision_state_v15.json
          if ! git diff --staged --quiet; then git commit -m "Update SDA scanner state"; git push origin main; else echo "No state changes to commit."; fi