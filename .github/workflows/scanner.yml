name: SDA Scanner

on:
  workflow_dispatch:
  schedule:
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run whale scanner
        run: python whale_scanner.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}

      - name: Run market scanner
        run: python market_scanner.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}

      - name: Update token metadata
        run: python token_metadata.py

      - name: Run liquidity scanner
        run: python liquidity_scanner.py

      - name: Validate generated JSON
        run: |
          python - <<'PY'
          import json
          files = [
              "whale_data.json", "whale_history.json", "whale_state.json",
              "market_data.json", "token_metadata.json", "liquidity_data.json",
              "positions.json", "wallet_data.json"
          ]
          for path in files:
              with open(path, encoding="utf-8") as f:
                  json.load(f)
              print("OK", path)
          PY

      - name: Run paper trading engine
        run: python main.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}

      - name: Validate final JSON
        run: |
          python - <<'PY'
          import json
          for path in [
              "whale_data.json", "whale_history.json", "whale_state.json",
              "market_data.json", "token_metadata.json", "liquidity_data.json",
              "positions.json", "wallet_data.json"
          ]:
              with open(path, encoding="utf-8") as f:
                  json.load(f)
              print("OK", path)
          PY

      - name: Show open paper positions
        run: |
          python - <<'PY'
          import json
          with open("positions.json", encoding="utf-8") as f:
              p = json.load(f)
          positions = p.get("positions", {})
          print(f"Open paper positions: {len(positions)}")
          for address, pos in positions.items():
              print(
                  f"- {pos.get('label', address)} | "
                  f"entry={pos.get('entry_price')} | "
                  f"TP1={pos.get('tp1')} | TP2={pos.get('tp2')} | SL={pos.get('sl')}"
              )
          PY

      - name: Commit state files
        run: |
          git config user.name "sda-scanner-bot"
          git config user.email "scanner@github.local"
          git add             state.json             whale_state.json             whale_data.json             whale_history.json             market_data.json             token_metadata.json             liquidity_data.json             sidra_swap_discovery.json             pending_signals.json             positions.json             wallet_data.json
          git diff --staged --quiet || git commit -m "Update scanner and paper trading state"
          git push origin main
