name: Autonomous SDA Paper Agent

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/autonomous_paper_agent.yml'
      - 'tools/forward_shadow_agent.py'
      - 'tools/forward_shadow_optimizer.py'
      - 'tests/test_forward_shadow_agent.py'
      - 'tests/test_forward_shadow_optimizer.py'
  pull_request:
    paths:
      - '.github/workflows/autonomous_paper_agent.yml'
      - 'tools/forward_shadow_agent.py'
      - 'tools/forward_shadow_optimizer.py'
      - 'tests/test_forward_shadow_agent.py'
      - 'tests/test_forward_shadow_optimizer.py'
  schedule:
    - cron: '42 * * * *'

permissions:
  contents: write

concurrency:
  group: autonomous-sda-paper-agent
  cancel-in-progress: false

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      REAL_TRADING_ENABLED: "false"
      REAL_TRADING_DRY_RUN: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Test forward-only learning, holdout selection and risk rollback
        run: python -m unittest discover -s tests -p 'test_forward_*.py' -v

      - name: Verify forward collector against actual scanner checkpoint
        # Read-only integration check: /tmp state is NEVER committed.
        run: python -m tools.forward_shadow_agent --state /tmp/forward_shadow_smoke.json

      - name: Check forward learning state and safely optimize PAPER only
        run: |
          python -m tools.forward_shadow_optimizer
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('strategy_lab/autonomous_agent_report.json').read_text())
          assert x['mode']=='PAPER_ONLY'
          assert x['real_trading'] is False
          assert x['paper_config_automatic'] is True
          config=json.loads(Path('v30_agent_config.json').read_text())
          assert config['version']=='V30-AUTO-CONFIG-1'
          if x['promotion_applied'] or x['rollback_applied']:
              assert config['source'].startswith('FORWARD_AGENT_')
              assert config['generation']>0
          print('AUTONOMOUS PAPER EVIDENCE GATE:',x['status'])
          PY

      - name: Persist research report and only evidence-gated PAPER settings
        # Source-change checks are diagnostic only and must not publish stale
        # reports or race an active checkpoint. Scheduled/manual runs own writes.
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          git config user.name 'sda-scanner-bot'
          git config user.email 'scanner@github.local'
          git add -f strategy_lab/autonomous_agent_report.json v30_agent_config.json
          if git diff --staged --quiet; then
            echo 'No new paper research evidence to commit.'
            exit 0
          fi

          config_changed=false
          if ! git diff --staged --quiet -- v30_agent_config.json; then
            config_changed=true
          fi
          base_config_blob="$(git rev-parse HEAD:v30_agent_config.json)"
          git commit -m 'Update forward SDA paper learning report'
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "Forward agent persisted on attempt $attempt"
              exit 0
            fi
            git fetch origin main

            if [ "$config_changed" = "true" ]; then
              # A simultaneous Champion change must NEVER be overwritten.
              remote_config_blob="$(git rev-parse origin/main:v30_agent_config.json)"
              if [ "$remote_config_blob" != "$base_config_blob" ]; then
                echo "::error::Champion changed concurrently; refusing stale promotion/rollback."
                exit 1
              fi
            fi

            if ! git rebase origin/main; then
              git rebase --abort || true
              if [ "$config_changed" = "true" ]; then
                echo "::error::Champion promotion/rollback could not be reconciled safely."
                exit 1
              fi
              # Report-only conflicts are common when source, scanner and
              # researcher publish concurrently. Keep artifacts; don't
              # clobber a newer analysis on main.
              echo "::warning::Newer report exists on main; skipping stale research-only commit."
              exit 0
            fi
            sleep 2
          done
          if [ "$config_changed" = "true" ]; then
            echo "::error::Could not persist verified paper Champion update."
            exit 1
          fi
          echo "::warning::Research report could not be published; archived as run artifact."

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forward-sda-paper-agent
          path: |
            strategy_lab/autonomous_agent_report.json
            v30_agent_config.json
          retention-days: 30
