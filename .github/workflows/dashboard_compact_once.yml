name: One-time compact main dashboard

on:
  push:
    paths:
      - .github/workflows/dashboard_compact_once.yml

permissions:
  contents: write

jobs:
  compact:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove duplicated token listing from main dashboard
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("telegram_dashboard.py")
          text = path.read_text(encoding="utf-8")
          old = ''' + _merge_wallet_portfolio(wallet, portfolio, md, ws, meta) + "\\n\\n🧭 POSITION ACTION\\n" + position_action'''
          new = ''' + "\\n\\n🧭 POSITION ACTION\\n" + position_action'''
          if old not in text:
              raise SystemExit("Target dashboard expression not found; refusing to modify file")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Commit dashboard cleanup and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add telegram_dashboard.py .github/workflows/dashboard_compact_once.yml
          git commit -m "Remove duplicated token list from main dashboard"
          git push