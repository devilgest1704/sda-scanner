name: Apply adaptive paper BUY scoring v2

on:
  push:
    paths:
      - '.github/workflows/apply_buy_scoring_v2.yml'
      - 'tools/apply_buy_scoring_v2.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply scoring patch
        run: python tools/apply_buy_scoring_v2.py
      - name: Commit scoring and remove patch files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add main.py
          git commit -m 'feat: adaptive paper BUY scoring v2'
          rm -f tools/apply_buy_scoring_v2.py .github/workflows/apply_buy_scoring_v2.yml
          git add -A
          git commit -m 'chore: remove one-shot scoring patch files'
          git push
