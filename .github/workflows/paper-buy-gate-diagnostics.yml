name: PAPER BUY gate diagnostics checks
on:
  pull_request:
    paths:
      - 'tools/paper_buy_gate_diagnostics.py'
      - 'tests/test_paper_buy_gate_diagnostics.py'
      - '.github/workflows/paper-buy-gate-diagnostics.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostic-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile diagnostics
        run: python -m py_compile tools/paper_buy_gate_diagnostics.py tests/test_paper_buy_gate_diagnostics.py
      - name: Run diagnostic unit tests
        run: python -m unittest discover -s tests -p 'test_paper_buy_gate_diagnostics.py' -v
      - name: Summarize checkpoint without changing state
        run: python tools/paper_buy_gate_diagnostics.py
