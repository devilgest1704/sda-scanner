name: Vercel Code Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vercel-code-deploy
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: team_Ni66yEoQsvqh6CTUt6YjXqlv
  VERCEL_PROJECT_ID: prj_nolTVKgPkLHUv9vOYvNE9xd1VRv6

jobs:
  deploy:
    # State-only commits must never create a Vercel deployment.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.head_commit.message != 'Update SDA scanner state' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Verify Vercel credentials
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "ERROR: GitHub Actions secret VERCEL_TOKEN is missing."
            echo "Add a Vercel token as the repository secret named VERCEL_TOKEN."
            exit 1
          fi

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Link Vercel project
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          vercel link --yes \
            --project="$VERCEL_PROJECT_ID" \
            --scope="$VERCEL_ORG_ID" \
            --token="$VERCEL_TOKEN"

      - name: Deploy to Vercel Production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          vercel deploy --prod --yes \
            --scope="$VERCEL_ORG_ID" \
            --token="$VERCEL_TOKEN"
