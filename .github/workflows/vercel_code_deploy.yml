name: Vercel Code Deploy

on:
  push:
    branches:
      - main
    paths:
      - '*.py'
      - '*.txt'
      - '*.md'
      - 'api/**'
      - 'requirements.txt'

permissions:
  contents: read

concurrency:
  group: vercel-code-deploy
  cancel-in-progress: true

jobs:
  deploy:
    # The scanner may touch Python files while committing its generated state.
    # Its commits must never create a Vercel deployment.
    if: ${{ github.event.head_commit.message != 'Update SDA scanner state' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy code to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_Ni66yEoQsvqh6CTUt6YjXqlv
          VERCEL_PROJECT_ID: prj_nolTVKgPkLHUv9vOYvNE9xd1VRv6
        run: |
          set -euo pipefail
          if [ -z "$VERCEL_TOKEN" ]; then
            echo 'VERCEL_TOKEN is missing.'
            exit 1
          fi
          # Never allow a Vercel CLI/network stall to hold the Actions
          # concurrency group forever and leave later deploys pending.
          timeout 90s npm install --global vercel@latest
          timeout 60s vercel link --yes \
            --project="$VERCEL_PROJECT_ID" \
            --scope="$VERCEL_ORG_ID" \
            --token="$VERCEL_TOKEN"
          timeout 180s vercel deploy --prod --yes \
            --scope="$VERCEL_ORG_ID" \
            --token="$VERCEL_TOKEN"
