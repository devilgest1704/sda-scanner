name: Vercel Code Deploy

# Deploy only code that passed the REAL trading test gate. State-only JSON
# checkpoints never trigger the gate and therefore never deploy.
on:
  workflow_run:
    workflows:
      - Real bridge unit tests
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: vercel-code-deploy
  cancel-in-progress: true

jobs:
  deploy:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success'
          && github.event.workflow_run.event == 'push'
          && github.event.workflow_run.head_branch == 'main'
          && github.event.workflow_run.head_commit.message != 'Update SDA scanner state' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout tested revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          filter: blob:none

      - name: Refuse to deploy superseded code
        run: |
          set -euo pipefail
          git fetch -q origin main
          # A newer code commit on main has its own gate run; never deploy older code over it.
          if ! python3 -m tools.worker_code_pin same-code HEAD FETCH_HEAD; then
            echo "Tested revision is no longer main's code; skipping deploy."
            echo "SKIP_DEPLOY=1" >> "$GITHUB_ENV"
          fi

      - name: Deploy code to Vercel
        if: env.SKIP_DEPLOY != '1'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_Ni66yEoQsvqh6CTUt6YjXqlv
          VERCEL_PROJECT_ID: prj_nolTVKgPkLHUv9vOYvNE9xd1VRv6
        run: |
          set -euo pipefail
          if [ -z "$VERCEL_TOKEN" ]; then
            echo 'VERCEL_TOKEN is missing.'
            exit 1
          fi
          # Never allow a Vercel CLI/network stall to hold the Actions
          # concurrency group forever and leave later deploys pending.
          timeout 90s npm install --global vercel@latest
          timeout 60s vercel link --yes \
            --project="$VERCEL_PROJECT_ID" \
            --scope="$VERCEL_ORG_ID" \
            --token="$VERCEL_TOKEN"
          timeout 180s vercel deploy --prod --yes \
            --scope="$VERCEL_ORG_ID" \
            --token="$VERCEL_TOKEN"
