name: Apply requested BUY score investment bands

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one_time_scoring_patch.yml

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.event.head_commit.message != 'Apply requested BUY score investment bands' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch main.py
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('main.py')
          s = p.read_text(encoding='utf-8')
          marker = '\n_paper.score = _paper_score_predictive\n_paper.create = _adaptive_create\n'
          insert = '''\n_paper.score = _paper_score_predictive\n\n# Requested BUY exposure bands: 65-74 cautious, 75-84 standard, 85-92 strong, 93+ pump.\ndef _investment_for_score_v2(confidence):\n    c = float(confidence or 0)\n    if c >= 85.0:\n        return 100.0\n    if c >= 75.0:\n        return 75.0\n    return 50.0\n\n_paper._investment_for_score = _investment_for_score_v2\nengine._investment_for_score = _investment_for_score_v2\n_paper.create = _adaptive_create\n'''
          if marker not in s:
              raise SystemExit('Expected scoring marker not found')
          if '_investment_for_score_v2' in s:
              raise SystemExit('Patch already present')
          p.write_text(s.replace(marker, insert, 1), encoding='utf-8')
          PY
      - name: Commit patch and remove one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/one_time_scoring_patch.yml
          git add main.py
          git commit -m 'Apply requested BUY score investment bands'
          git push
