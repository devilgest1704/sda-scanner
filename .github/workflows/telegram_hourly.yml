name: SDA Telegram Hourly Report

on:
  # Intentionally no schedule here.
  # The hourly report is triggered only by the external cronjob.org timer.
  # Telegram REFRESH is handled directly by the Vercel webhook and does not
  # dispatch this workflow.
  workflow_dispatch:
    inputs:
      run_reason:
        description: Report trigger reason
        required: false
        default: Manual test
        type: string

permissions:
  contents: read

concurrency:
  group: sda-telegram-hourly
  cancel-in-progress: true

jobs:
  report:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      CHAT_ID: ${{ secrets.CHAT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Send hourly Telegram dashboard
        run: python send_telegram_hourly.py
