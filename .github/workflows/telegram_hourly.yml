name: SDA Telegram Hourly Report

on:
  # Automatic dashboard pushes are disabled: no schedule. The interactive
  # Telegram menu is the user-facing dashboard. Manual dispatch remains for debugging.
  # Run delivery tests when this workflow is changed.
  push:
    branches: [main]
    paths:
      - '.github/workflows/telegram_hourly.yml'
  workflow_dispatch:
    inputs:
      run_reason:
        description: Report trigger reason
        required: false
        default: Manual test
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: sda-telegram-hourly
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      CHAT_ID: ${{ secrets.CHAT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Test Telegram delivery helpers
        run: python -m unittest discover -s tests -p 'test_telegram_delivery.py' -v

      - name: Avoid automatic dashboard reports
        id: dedupe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          REPORT_REASON: ${{ inputs.run_reason }}
        run: |
          set -euo pipefail
          echo "skip=false" >> "$GITHUB_OUTPUT"
          if [ "$EVENT_NAME" = "push" ]; then
            echo "Workflow update: delivery tests only; no extra Telegram post."
            exit 0
          fi
          if [ "$EVENT_NAME" != "workflow_dispatch" ] || [ "$REPORT_REASON" = "Cronjob hourly" ] || [ "$REPORT_REASON" = "Telegram Refresh" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Automatic Telegram dashboard reports are disabled; no push."
            exit 0
          fi
          echo "Manual Telegram report requested."
          exit 0

      - name: Send hourly Telegram dashboard
        # A workflow source update runs tests only; don't send extra Telegram posts.
        if: steps.dedupe.outputs.skip != 'true' && github.event_name != 'push'
        run: python send_telegram_hourly.py
