name: SDA Scanner V18

on:
  workflow_dispatch:
    inputs:
      run_reason:
        description: Manual run reason
        required: false
        default: Manual test
        type: string
      send_report:
        description: After the scanner, dispatch SDA Telegram Hourly Report
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: sda-scanner-paper
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      CHAT_ID: ${{ secrets.CHAT_ID }}
      REAL_TRADING_ENABLED: "false"
      REAL_TRADING_DRY_RUN: "true"
      REAL_TRADING_PRIVATE_KEY: ${{ secrets.REAL_TRADING_PRIVATE_KEY }}
      REAL_TRADING_WALLET_ADDRESS: ${{ secrets.REAL_TRADING_WALLET_ADDRESS }}
      GITHUB_DISPATCH_TOKEN: ${{ secrets.GITHUB_DISPATCH_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Backup last valid wallet snapshot
        run: |
          cp wallet_data.json /tmp/wallet_data.before.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ensure Telegram webhook is active
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          token = os.environ.get("TELEGRAM_TOKEN", "")
          desired = "https://sda-scanner.vercel.app/api/telegram"
          if not token:
              raise SystemExit("TELEGRAM_TOKEN is not configured")

          base = f"https://api.telegram.org/bot{token}"
          with urllib.request.urlopen(f"{base}/getWebhookInfo", timeout=15) as response:
              info = json.loads(response.read().decode("utf-8"))
          current = ((info.get("result") or {}).get("url") or "").strip()
          if current != desired:
              payload = urllib.parse.urlencode({"url": desired, "allowed_updates": json.dumps(["callback_query"])}).encode()
              req = urllib.request.Request(f"{base}/setWebhook", data=payload, method="POST")
              with urllib.request.urlopen(req, timeout=15) as response:
                  result = json.loads(response.read().decode("utf-8"))
              if not result.get("ok"):
                  raise SystemExit(f"setWebhook failed: {result}")
              print(f"Telegram webhook set to {desired}")
          else:
              print(f"Telegram webhook already active: {desired}")
          PY

      - name: Run SDA Scanner V18
        run: bash run_scanner_v18.sh

      - name: Protect wallet snapshot and sync portfolio
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          wallet_path = Path('wallet_data.json')
          backup_path = Path('/tmp/wallet_data.before.json')
          try:
              current = json.loads(wallet_path.read_text(encoding='utf-8'))
          except Exception:
              current = {}
          try:
              backup = json.loads(backup_path.read_text(encoding='utf-8'))
          except Exception:
              backup = {}

          failed = bool(current.get('error')) or not isinstance(current.get('holdings'), list)
          if failed and isinstance(backup, dict) and backup.get('holdings'):
              preserved = dict(backup)
              preserved['error'] = current.get('error') or 'Wallet refresh failed; preserved previous snapshot.'
              preserved['stale'] = True
              preserved['stale_at'] = current.get('updated_at')
              wallet_path.write_text(json.dumps(preserved, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
              print('Preserved previous valid wallet snapshot after failed refresh.')
          elif isinstance(current, dict):
              current['stale'] = False
              current.pop('stale_at', None)
              wallet_path.write_text(json.dumps(current, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY
          python sync_real_wallet.py

      - name: Verify real trader remains disabled
        run: python real_trader.py

      - name: Read-only real wallet dry-run check
        run: python real_trader_dry_run.py

      - name: Commit scanner state
        run: |
          git config user.name 'sda-scanner-bot'
          git config user.email 'scanner@github.local'
          git add main.py market_scanner.py liquidity_scanner.py state.json whale_state.json whale_data.json market_data.json token_metadata.json liquidity_data.json paper_stats.json sidra_swap_discovery.json pending_signals.json positions.json wallet_data.json decision_state_v15.json whale_history.json portfolio_data.json paper_auto_state.json paper_buy_guard_state.json sync_real_wallet.py real_trading_config.py real_trader.py real_trader_dry_run.py real_trade_state.json
          if git diff --staged --quiet; then
            echo 'No scanner state changes to commit.'
            exit 0
          fi
          git commit -m 'Update SDA scanner state'

          # Cron runs can overlap while the scanner is still working. Rebase the
          # generated state commit onto the newest main and retry instead of
          # failing simply because another scanner run pushed first.
          for attempt in 1 2 3 4 5; do
            if git push origin main; then
              echo "State push succeeded on attempt $attempt."
              break
            fi
            if [ "$attempt" = "5" ]; then
              echo 'State push failed after 5 attempts.'
              exit 1
            fi
            git fetch origin main
            git rebase origin/main
            sleep 2
          done

      - name: Dispatch SDA Telegram Hourly Report after requested refresh
        if: ${{ inputs.send_report == true || inputs.send_report == 'true' }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          token = os.environ.get('GITHUB_DISPATCH_TOKEN', '')
          if not token:
              raise SystemExit('missing GITHUB_DISPATCH_TOKEN')

          url = 'https://api.github.com/repos/devilgest1704/sda-scanner/actions/workflows/telegram_hourly.yml/dispatches'
          payload = json.dumps({
              'ref': 'main',
              'inputs': {'run_reason': 'Telegram Refresh'},
          }).encode()
          req = urllib.request.Request(
              url,
              data=payload,
              headers={
                  'Accept': 'application/vnd.github+json',
                  'Authorization': f'Bearer {token}',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'Content-Type': 'application/json',
              },
              method='POST',
          )
          try:
              with urllib.request.urlopen(req, timeout=20) as response:
                  if response.status not in (200, 201, 204):
                      raise SystemExit(f'GitHub dispatch HTTP {response.status}')
                  print('SDA Telegram Hourly Report dispatched.')
          except urllib.error.HTTPError as exc:
              body = exc.read().decode('utf-8', errors='replace')
              raise SystemExit(f'GitHub dispatch HTTP {exc.code}: {body[:500]}')
          PY
