name: SDA Scanner V18

on:
  workflow_dispatch:
    inputs:
      run_reason:
        description: Manual run reason
        required: false
        default: Manual test
        type: string
      send_report:
        description: After the scanner, dispatch SDA Telegram Hourly Report
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: sda-scanner-paper
  # The minute cron may continue dispatching this workflow. Only one worker
  # runs; at most one pending dispatch is kept by GitHub's default queue.
  # NEVER cancel the active worker: it owns the paper-trading state loop.
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      CHAT_ID: ${{ secrets.CHAT_ID }}
      REAL_TRADING_ENABLED: "false"
      REAL_TRADING_DRY_RUN: "true"
      REAL_TRADING_PRIVATE_KEY: ${{ secrets.REAL_TRADING_PRIVATE_KEY }}
      REAL_TRADING_WALLET_ADDRESS: ${{ secrets.REAL_TRADING_WALLET_ADDRESS }}
      GITHUB_DISPATCH_TOKEN: ${{ secrets.GITHUB_DISPATCH_TOKEN }}
      SCANNER_CONTINUOUS: "true"
      SCANNER_INTERVAL_SECONDS: "60"
      SCANNER_STATE_CHECKPOINT_SECONDS: "300"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Backup last valid wallet snapshot
        run: |
          cp wallet_data.json /tmp/wallet_data.before.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ensure Telegram webhook is active
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          token = os.environ.get("TELEGRAM_TOKEN", "")
          desired = "https://sda-scanner.vercel.app/api/telegram"
          if not token:
              raise SystemExit("TELEGRAM_TOKEN is not configured")

          base = f"https://api.telegram.org/bot{token}"
          with urllib.request.urlopen(f"{base}/getWebhookInfo", timeout=15) as response:
              info = json.loads(response.read().decode("utf-8"))
          current = ((info.get("result") or {}).get("url") or "").strip()
          if current != desired:
              payload = urllib.parse.urlencode({"url": desired, "allowed_updates": json.dumps(["callback_query"])}).encode()
              req = urllib.request.Request(f"{base}/setWebhook", data=payload, method="POST")
              with urllib.request.urlopen(req, timeout=15) as response:
                  result = json.loads(response.read().decode("utf-8"))
              if not result.get("ok"):
                  raise SystemExit(f"setWebhook failed: {result}")
              print(f"Telegram webhook set to {desired}")
          else:
              print(f"Telegram webhook already active: {desired}")
          PY

      - name: Verify scanner source and bytecode before run
        run: |
          echo "HEAD=$(git rev-parse HEAD)"
          git status --short
          # Force tracked source files back to the exact blobs from HEAD.
          # This prevents any stale workspace copy from reaching the Python interpreter.
          git checkout HEAD -- v26_pump_hunter.py main.py paper_engine_v19.py
          echo "HEAD v26 blob:"
          git rev-parse HEAD:v26_pump_hunter.py
          echo "WORKTREE v26 sha256:"
          sha256sum v26_pump_hunter.py
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          python -m py_compile v26_pump_hunter.py main.py paper_engine_v19.py
          python - <<'PY'
          from pathlib import Path
          line = Path("v26_pump_hunter.py").read_text(encoding="utf-8").splitlines()[28]
          print(f"v26 line 29: {line}")
          if "PRICE_FLOW_RATIO_MIN=0.75." in line:
              raise SystemExit("Refusing to run: stale/malformed V28.7 source detected")
          PY

      - name: Run SDA Scanner V18 continuously
        run: bash run_scanner_v18.sh

