name: SDA Scanner V18

on:
  workflow_dispatch:
    inputs:
      run_reason:
        description: Manual run reason
        required: false
        default: Manual test
        type: string
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: sda-scanner-paper
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      CHAT_ID: ${{ secrets.CHAT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run SDA Scanner V18
        run: bash run_scanner_v18.sh

      - name: Commit scanner state
        run: |
          git config user.name 'sda-scanner-bot'
          git config user.email 'scanner@github.local'
          git add main.py market_scanner.py liquidity_scanner.py state.json whale_state.json whale_data.json market_data.json token_metadata.json liquidity_data.json paper_stats.json sidra_swap_discovery.json pending_signals.json positions.json wallet_data.json decision_state_v15.json whale_history.json portfolio_data.json paper_auto_state.json
          if git diff --staged --quiet; then
            echo 'No state changes to commit.'
          else
            git commit -m 'Update SDA scanner state'
            git push origin main
          fi
