name: AI Strategy Lab (paper shadow)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/strategy-lab.yml'
      - 'tools/strategy_lab.py'
      - 'tools/trade_cohort_research.py'
      - 'tools/candidate_price_tracker.py'
      - 'tests/test_strategy_lab.py'
      - 'tests/test_trade_cohort_research.py'
  schedule:
    - cron: '17 3 * * *'
permissions:
  contents: write
concurrency:
  group: strategy-lab-paper-shadow
  cancel-in-progress: false
jobs:
  evidence-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install chart dependency
        run: python -m pip install 'Pillow>=10,<13'
      - name: Test paper-only safeguards
        run: python -m unittest discover -s tests -p 'test_strategy_lab.py' -v
      - name: Test chronological research safeguards
        run: python -m unittest discover -s tests -p 'test_trade_cohort_research.py' -v
      - name: Verify large paper ledger and archive without truncation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for name in ('positions.json','strategy_lab/closed_trades.json','v30_optimizer_trades.json'):
              path=Path(name)
              if not path.exists():
                  print(f'LEDGER AUDIT {name}: MISSING')
                  continue
              size=path.stat().st_size
              try:
                  data=json.loads(path.read_text(encoding='utf-8'))
              except (ValueError, OSError) as exc:
                  print(f'::warning::LEDGER AUDIT {name}: INVALID size={size}: {exc}')
                  continue
              if isinstance(data,dict):
                  closed=data.get('closed_trades',[])
                  positions=data.get('positions',{})
                  trades=data.get('trades')
                  optimizer_count=len(trades) if isinstance(trades,(dict,list)) else 'N/A'
                  print(f'LEDGER AUDIT {name}: VALID size={size} closed={len(closed) if isinstance(closed,list) else "INVALID"} open={len(positions) if isinstance(positions,dict) else "INVALID"} optimizer_trades={optimizer_count} keys={list(data)[:15]}')
              elif isinstance(data,list):
                  print(f'LEDGER AUDIT {name}: VALID size={size} rows={len(data)}')
              else:
                  print(f'::warning::LEDGER AUDIT {name}: unexpected root type {type(data).__name__}')
          PY
      - name: Update durable closed-trade archive
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from tools.export_paper_trades import export
          source=Path('positions.json')
          archive=Path('strategy_lab/closed_trades.json')
          try:
              state=json.loads(source.read_text(encoding='utf-8'))
              if not isinstance(state,dict) or not isinstance(state.get('closed_trades'),list):
                  raise ValueError('No closed_trades list')
          except (OSError,ValueError) as exc:
              print('Skipping trade archive export: invalid/empty positions state:',exc)
              archive.parent.mkdir(parents=True,exist_ok=True)
              if not archive.exists(): archive.write_text(json.dumps([]),encoding='utf-8')
          else:
              print('Archive trade counts:',export(source,archive))
          PY
      - name: Join candidate decisions to later SDA quotes (research only)
        run: python tools/candidate_price_tracker.py
      - name: Analyze observed closed-trade cohorts (research only)
        run: python tools/trade_cohort_research.py --output strategy_lab/research.json
      - name: Generate paper-only shadow candidate and Telegram status
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python tools/strategy_lab.py --telegram --output strategy_lab/report.json --png strategy_lab/status.png
      - name: Validate never promotes
        run: |
          python - <<'PY'
          import json
          x=json.load(open('strategy_lab/report.json'))
          assert x['mode']=='paper_shadow_proposal_only'
          assert x['production_mutated'] is False
          assert x['promotion_eligible'] is False
          assert x['challenger']['status']=='UNVALIDATED'
          assert x['cohort_evidence']['validates_new_strategy'] is False
          assert x['candidate_evidence']['promotion_eligible'] is False
          assert x['candidate_evidence']['observed_15m'] <= x['candidate_evidence']['candidate_snapshots']
          assert x['candidate_evidence']['observed_60m'] <= x['candidate_evidence']['candidate_snapshots']
          print('Paper-only evidence gate OK:', x['cohort_evidence'], x['candidate_evidence'])
          PY
      - name: Persist research archives to repository
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f strategy_lab/closed_trades.json strategy_lab/candidate_outcomes.json
          if git diff --cached --quiet; then
            echo 'No research archive changes'
          else
            git commit -m 'chore: persist paper research archives [skip ci]'
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: strategy-lab-report
          path: |
            strategy_lab/report.json
            strategy_lab/research.json
            strategy_lab/candidate_outcomes.json
            strategy_lab/status.png
          retention-days: 30
