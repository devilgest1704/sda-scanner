name: AI Strategy Lab (paper shadow)
on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
permissions:
  contents: read
jobs:
  evidence-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run read-only strategy analysis
        run: python tools/strategy_lab.py --output strategy_lab/report.json
      - name: Validate never promotes
        run: |
          python - <<'PY'
          import json
          x=json.load(open('strategy_lab/report.json'))
          assert x['mode']=='paper_shadow_proposal_only'
          assert x['production_mutated'] is False
          assert x['promotion_eligible'] is False
          assert x['challenger']['status']=='UNVALIDATED'
          print('Paper-only evidence gate OK')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: strategy-lab-report
          path: strategy_lab/report.json
          retention-days: 30
