name: AI Strategy Lab (paper shadow)
on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
permissions:
  contents: write
concurrency:
  group: strategy-lab-paper-shadow
  cancel-in-progress: false
jobs:
  evidence-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install chart dependency
        run: python -m pip install 'Pillow>=10,<13'
      - name: Test paper-only safeguards
        run: python -m unittest discover -s tests -p 'test_strategy_lab.py' -v
      - name: Test chronological research safeguards
        run: python -m unittest discover -s tests -p 'test_trade_cohort_research.py' -v
      - name: Update durable closed-trade archive
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from tools.export_paper_trades import export
          source=Path('positions.json')
          archive=Path('strategy_lab/closed_trades.json')
          try:
              state=json.loads(source.read_text(encoding='utf-8'))
              if not isinstance(state,dict) or not isinstance(state.get('closed_trades'),list):
                  raise ValueError('No closed_trades list')
          except (OSError,ValueError) as exc:
              print('Skipping trade archive export: invalid/empty positions state:',exc)
              archive.parent.mkdir(parents=True,exist_ok=True)
              if not archive.exists(): archive.write_text(json.dumps([]),encoding='utf-8')
          else:
              print('Archive trade counts:',export(source,archive))
          PY
      - name: Join candidate decisions to later SDA quotes (research only)
        run: python tools/candidate_price_tracker.py
      - name: Analyze observed closed-trade cohorts (research only)
        run: python tools/trade_cohort_research.py --output strategy_lab/research.json
      - name: Generate paper-only shadow candidate and Telegram status
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python tools/strategy_lab.py --telegram --output strategy_lab/report.json --png strategy_lab/status.png
      - name: Validate never promotes
        run: |
          python - <<'PY'
          import json
          x=json.load(open('strategy_lab/report.json'))
          assert x['mode']=='paper_shadow_proposal_only'
          assert x['production_mutated'] is False
          assert x['promotion_eligible'] is False
          assert x['challenger']['status']=='UNVALIDATED'
          print('Paper-only evidence gate OK')
          PY
      - name: Persist research archives to repository
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f strategy_lab/closed_trades.json strategy_lab/candidate_outcomes.json
          if git diff --cached --quiet; then
            echo 'No research archive changes'
          else
            git commit -m 'chore: persist paper research archives [skip ci]'
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: strategy-lab-report
          path: |
            strategy_lab/report.json
            strategy_lab/research.json
            strategy_lab/candidate_outcomes.json
            strategy_lab/status.png
          retention-days: 30
