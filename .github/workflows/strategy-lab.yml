name: AI Strategy Lab (paper shadow)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/strategy-lab.yml'
      - 'tools/strategy_lab.py'
      - 'tools/trade_cohort_research.py'
      - 'tools/candidate_price_tracker.py'
      - 'tests/test_strategy_lab.py'
      - 'tests/test_trade_cohort_research.py'
      - 'tools/paper_trade_lessons.py'
      - 'tests/test_paper_trade_lessons.py'
      - 'tools/v31_profit_learning.py'
      - 'tests/test_v31_profit_learning.py'
      - 'tools/paper_reconciliation.py'
      - 'tests/test_paper_reconciliation.py'
      - 'tests/test_paper_report_sources.py'
      - 'tools/paper_trade_lessons.py'
      - 'tools/export_paper_trades.py'
      - 'tools/v30_exit_parity.py'
      - 'tests/test_v30_exit_parity.py'
      - 'v30_pump_hunter.py'
  pull_request:
    paths:
      - '.github/workflows/strategy-lab.yml'
      - 'tools/v31_profit_learning.py'
      - 'tests/test_v31_profit_learning.py'
      - 'tools/paper_reconciliation.py'
      - 'tests/test_paper_reconciliation.py'
      - 'tests/test_paper_report_sources.py'
      - 'tools/paper_trade_lessons.py'
      - 'tools/export_paper_trades.py'
      - 'tools/v30_exit_parity.py'
      - 'tests/test_v30_exit_parity.py'
      - 'v30_pump_hunter.py'
  schedule:
    - cron: '17 3 * * *'
permissions:
  contents: write
concurrency:
  group: strategy-lab-paper-shadow
  cancel-in-progress: false
jobs:
  evidence-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install chart dependency
        run: python -m pip install 'Pillow>=10,<13'
      - name: Test paper-only safeguards
        run: python -m unittest discover -s tests -p 'test_strategy_lab.py' -v
      - name: Test chronological research safeguards
        run: python -m unittest discover -s tests -p 'test_trade_cohort_research.py' -v
      - name: Test historical SDA paper lessons
        run: python -m unittest discover -s tests -p 'test_paper_trade_lessons.py' -v
      - name: Test accounting identity, archive preservation and CLI report alignment
        run: |
          python -m py_compile tools/paper_reconciliation.py tools/paper_trade_lessons.py tools/v31_profit_learning.py
          python -m unittest discover -s tests -p 'test_paper_reconciliation.py' -v
          python -m unittest discover -s tests -p 'test_paper_report_sources.py' -v

      - name: Test V31 profit-learning and V30 exit telemetry
        run: |
          python -m py_compile v30_pump_hunter.py tools/v31_profit_learning.py tools/v30_exit_parity.py
          python -m unittest discover -s tests -p 'test_v31_profit_learning.py' -v
          python -m unittest discover -s tests -p 'test_v30_telemetry.py' -v
          python -m unittest discover -s tests -p 'test_v30_exit_parity.py' -v
      - name: Verify large paper ledger and archive without truncation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for name in ('positions.json','strategy_lab/closed_trades.json','v30_optimizer_trades.json'):
              path=Path(name)
              if not path.exists():
                  print(f'LEDGER AUDIT {name}: MISSING')
                  continue
              size=path.stat().st_size
              try:
                  data=json.loads(path.read_text(encoding='utf-8'))
              except (ValueError, OSError) as exc:
                  print(f'::warning::LEDGER AUDIT {name}: INVALID size={size}: {exc}')
                  continue
              if isinstance(data,dict):
                  closed=data.get('closed_trades',[])
                  positions=data.get('positions',{})
                  trades=data.get('trades')
                  optimizer_count=len(trades) if isinstance(trades,(dict,list)) else 'N/A'
                  print(f'LEDGER AUDIT {name}: VALID size={size} closed={len(closed) if isinstance(closed,list) else "INVALID"} open={len(positions) if isinstance(positions,dict) else "INVALID"} optimizer_trades={optimizer_count} keys={list(data)[:15]}')
              elif isinstance(data,list):
                  print(f'LEDGER AUDIT {name}: VALID size={size} rows={len(data)}')
              else:
                  print(f'::warning::LEDGER AUDIT {name}: unexpected root type {type(data).__name__}')
          PY
      - name: Update durable closed-trade archive
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from tools.export_paper_trades import export
          source=Path('positions.json')
          archive=Path('strategy_lab/closed_trades.json')
          try:
              state=json.loads(source.read_text(encoding='utf-8'))
              if not isinstance(state,dict) or not isinstance(state.get('closed_trades'),list):
                  raise ValueError('No closed_trades list')
          except (OSError,ValueError) as exc:
              print('Skipping trade archive export: invalid/empty positions state:',exc)
              archive.parent.mkdir(parents=True,exist_ok=True)
              if not archive.exists(): archive.write_text(json.dumps([]),encoding='utf-8')
          else:
              print('Archive trade counts:',export(source,archive))
          PY
      - name: Reconcile CURRENT paper P/L vs append-only historical archive
        run: python -m tools.paper_reconciliation

      - name: Explain completed paper trades, including latest PINE, by exit type
        run: python -m tools.paper_trade_lessons
      - name: V31 profit-learning research – identical observed-trade cohorts only
        run: python -m tools.v31_profit_learning
      - name: Verify research never affects trading
        run: |
          python - <<'PY'
          import json
          r=json.load(open('strategy_lab/v31_profit_learning.json'))
          assert r['mode']=='READ_ONLY_PAPER_RESEARCH'
          assert r['accounting_source']=='CURRENT_positions_json_closed_trades_only'
          assert r['archive_accounting_role']=='append_only_audit_not_current_pnl'
          assert r['ledger_reconciliation']['current_accounting_reconciled'] == r['statistics_reconciled']
          assert r['paper_only'] is True and r['real_trading'] is False
          assert r['production_mutated'] is False
          assert r['promotion_eligible'] is False
          assert r['automatically_applied'] is False
          assert r['exit_research']['selection_uses_train_only'] is True
          assert r['v30_exit_parity']['can_unlock_paper_autopromotion'] is False
          assert r['v30_exit_parity']['runtime_entry_exit_parity_verified'] is False
          assert (r['v30_exit_parity']['matched'] +
                  r['v30_exit_parity']['mismatched'] +
                  r['v30_exit_parity']['excluded']
                  == r['v30_exit_parity']['audited'])
          print('V30 exit replay evidence:', r['v30_exit_parity'])
          print('V31 read-only evidence:',r['data_quality'])
          PY
      - name: Join candidate decisions to later SDA quotes (research only)
        run: python tools/candidate_price_tracker.py
      - name: Analyze observed closed-trade cohorts (research only)
        run: python tools/trade_cohort_research.py --output strategy_lab/research.json
      - name: Generate research-only shadow candidate (no extra Telegram messages)
        run: python tools/strategy_lab.py --output strategy_lab/report.json --png strategy_lab/status.png
      - name: Validate never promotes
        run: |
          python - <<'PY'
          import json
          x=json.load(open('strategy_lab/report.json'))
          assert x['mode']=='paper_shadow_proposal_only'
          assert x['production_mutated'] is False
          assert x['promotion_eligible'] is False
          assert x['challenger']['status']=='UNVALIDATED'
          assert x['cohort_evidence']['validates_new_strategy'] is False
          assert x['candidate_evidence']['promotion_eligible'] is False
          assert x['candidate_evidence']['observed_15m'] <= x['candidate_evidence']['candidate_snapshots']
          assert x['candidate_evidence']['observed_60m'] <= x['candidate_evidence']['candidate_snapshots']
          print('Paper-only evidence gate OK:', x['cohort_evidence'], x['candidate_evidence'])
          PY
      - name: Persist research archives to repository
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Keep reviewed evidence alongside the durable trade/price archives.
          # These are small, reproducible PAPER research reports, not live settings.
          # Candidate outcomes are written ONLY by the continuous scanner;
          # the daily Strategy Lab reads that archive but must never push
          # its own stale copy over newer scanner candidate observations.
          git add -f strategy_lab/closed_trades.json strategy_lab/research.json strategy_lab/trade_lessons.json strategy_lab/v31_profit_learning.json strategy_lab/paper_reconciliation.json strategy_lab/report.json
          if git diff --cached --quiet; then
            echo 'No research archive changes'
          else
            git commit -m 'chore: persist paper research archives [skip ci]'
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: strategy-lab-report
          path: |
            strategy_lab/report.json
            strategy_lab/research.json
            strategy_lab/trade_lessons.json
            strategy_lab/v31_profit_learning.json
            strategy_lab/paper_reconciliation.json
            strategy_lab/candidate_outcomes.json
            strategy_lab/status.png
          retention-days: 30
