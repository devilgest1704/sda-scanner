name: V30 state audit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'v30_pump_hunter.py'
      - 'tools/**'
      - 'tests/test_*telemetry.py'
      - '.github/workflows/v30-state-audit.yml'
  schedule:
    - cron: '17,47 * * * *'
  push:
    branches: [main]
    paths:
      - 'tools/**'
      - 'v30_pump_hunter.py'
      - 'tests/test_*telemetry.py'
      - 'v30_pump_state.json'
      - '.github/workflows/v30-state-audit.yml'

permissions:
  contents: read

concurrency:
  group: v30-state-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out scanner state
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test paper telemetry
        run: python -m unittest discover -s tests -p 'test_*telemetry.py'
      - name: Generate paper trade telemetry report
        id: telemetry
        continue-on-error: true
        run: python tools/paper_telemetry_report.py positions.json > v30_paper_telemetry_report.json
      - name: Run read-only audit
        run: |
          python tools/audit_v30_state.py v30_pump_state.json > v30_audit_report.json
      - name: Validate telemetry availability
        if: always() && github.event_name != 'pull_request'
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path('v30_paper_telemetry_report.json')
          report=json.loads(p.read_text(encoding='utf-8')) if p.exists() else {'status':'report_missing'}
          status=report.get('status')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as out:
              out.write(f'## Paper telemetry: {status}\\n')
              if status!='ok':out.write('WARNING: No actual trade records in this GitHub checkout.\\n')
          if status!='ok':
              print('::error::Paper telemetry missing: scanner positions.json is not synchronized into this checkout')
              raise SystemExit(1)
          PY
      - name: Publish audit summary
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path("v30_audit_report.json")
          if not path.exists():
              raise SystemExit("Audit report missing: see Run read-only audit logs")
          report = json.loads(path.read_text(encoding="utf-8"))
          issues = report.get("issues", [])
          lines = [
              "## V30 state audit",
              f"- State updated: {report.get('state_updated_at', 'unknown')}",
              f"- Tokens: {report.get('token_count', 0)}",
              f"- Phases: {report.get('phases', {})}",
              f"- Fresh: {report.get('fresh_count', 0)}",
              f"- Zero last volume: {report.get('zero_last_volume_count', 0)}",
              f"- Severe negative acceleration with volume: {report.get('acceleration_le_minus90_with_volume', 0)}",
              f"- Diagnostic flags: {len(issues)}",
              "",
              "### Flags (first 30)",
          ]
          lines.extend(f"- {i.get('token')}: {i.get('issue')}" for i in issues[:30])
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as output:
              output.write("\n".join(lines) + "\n")
          PY
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v30-state-audit-${{ github.run_id }}
          path: |
            v30_audit_report.json
            v30_paper_telemetry_report.json
          if-no-files-found: warn
          retention-days: 14
