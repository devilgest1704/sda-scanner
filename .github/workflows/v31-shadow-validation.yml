name: V31 shadow validation (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Unit tests
        run: python -m unittest discover -s tests -p 'test_v31_shadow_market.py' -v
      - name: Snapshot shadow evaluation
        run: python -m experiments.v31_shadow_market market_analysis.json --output v31_shadow_result.json
      - name: Upload snapshot report
        uses: actions/upload-artifact@v4
        with:
          name: v31-shadow-result
          path: v31_shadow_result.json
          retention-days: 14
