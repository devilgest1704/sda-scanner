name: V30 AI Optimizer

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/v30_ai_optimizer.py'
      - 'v30_optimizer_trades.json'
      - '.github/workflows/v30_ai_optimizer.yml'
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write
  actions: write

concurrency:
  group: v30-ai-optimizer
  cancel-in-progress: true

jobs:
  optimize:
    runs-on: ubuntu-latest
    env:
      REAL_TRADING_ENABLED: "false"
      REAL_TRADING_DRY_RUN: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify paper-only optimizer
        run: |
          python -m py_compile tools/v30_ai_optimizer.py
          python tools/v30_ai_optimizer.py
          python - <<'PY'
          import json
          x=json.load(open("v30_ai_optimizer.json",encoding="utf-8"))
          assert x["mode"]=="PAPER_ONLY"
          assert x["guardrails"]["real_trading"] is False
          assert x["auto_apply"] is False
          print("Optimizer guardrails OK")
          PY

      - name: Persist optimizer report
        run: |
          git config user.name 'sda-scanner-bot'
          git config user.email 'scanner@github.local'
          git add v30_ai_optimizer.json
          if git diff --staged --quiet; then
            echo "No optimizer report change."
            exit 0
          fi
          git commit -m 'Update V30 AI optimizer report'
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main || { git rebase --abort || true; exit 1; }
            sleep 2
          done
          exit 1


      - name: Restart SDA Scanner on current main
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          echo "Restarting long-lived paper scanner after successful optimizer run."

          # Cancel all active/pending SDA Scanner V18 runs so no old checkout
          # keeps running after optimizer/code updates.
          run_ids="$(gh api "repos/$REPO/actions/workflows/scanner_v18.yml/runs?per_page=100" \
            --jq '.workflow_runs[] | select(.status=="in_progress" or .status=="queued" or .status=="pending" or .status=="waiting" or .status=="requested") | .id')"

          for id in $run_ids; do
            echo "Cancelling scanner run $id"
            gh api --method POST "repos/$REPO/actions/runs/$id/cancel" || true
          done

          # Wait briefly for the concurrency slot to be released.
          for i in $(seq 1 30); do
            active="$(gh api "repos/$REPO/actions/workflows/scanner_v18.yml/runs?per_page=20" \
              --jq '[.workflow_runs[] | select(.status=="in_progress" or .status=="queued" or .status=="pending" or .status=="waiting" or .status=="requested")] | length')"
            [ "$active" = "0" ] && break
            sleep 2
          done

          echo "Dispatching fresh SDA Scanner V18 from main"
          gh workflow run scanner_v18.yml --repo "$REPO" --ref main
