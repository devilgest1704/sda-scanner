name: V30 AI Optimizer

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/v30_ai_optimizer.py'
      - 'v30_optimizer_trades.json'
      - '.github/workflows/v30_ai_optimizer.yml'
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write
  actions: write

concurrency:
  group: v30-ai-optimizer
  cancel-in-progress: true

jobs:
  optimize:
    runs-on: ubuntu-latest
    env:
      REAL_TRADING_ENABLED: "false"
      REAL_TRADING_DRY_RUN: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify paper-only optimizer
        run: |
          python -m py_compile tools/v30_ai_optimizer.py
          python tools/v30_ai_optimizer.py
          python - <<'PY'
          import json
          x=json.load(open("v30_ai_optimizer.json",encoding="utf-8"))
          assert x["mode"]=="PAPER_ONLY"
          assert x["guardrails"]["real_trading"] is False
          assert x["auto_apply"] is True
          print("Optimizer guardrails OK")
          PY

      - name: Persist optimizer report
        run: |
          git config user.name 'sda-scanner-bot'
          git config user.email 'scanner@github.local'
          git add v30_ai_optimizer.json v30_agent_config.json
          if git diff --staged --quiet; then
            echo "No optimizer report change."
            exit 0
          fi
          git commit -m 'Update V30 AI optimizer report'
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main || { git rebase --abort || true; exit 1; }
            sleep 2
          done
          exit 1


      # Optimizer must never cancel the active paper worker: this can leave
      # open positions without stop evaluation and may interrupt checkpoints.
      # Configuration updates take effect on the next safe worker start.
      - name: Verify scanner continuity (non-disruptive)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          active="$(gh api "repos/$REPO/actions/workflows/scanner_v18.yml/runs?per_page=30" \
            --jq '[.workflow_runs[] | select(.status=="in_progress" or .status=="queued" or .status=="pending" or .status=="waiting" or .status=="requested")] | length')"
          echo "Active/pending scanner runs: $active"
          if [ "$active" -eq 0 ]; then
            echo "::warning::No active scanner. Dispatching recovery watchdog; do not cancel any worker."
            gh workflow run scanner_watchdog.yml --repo "$REPO" --ref main
          else
            echo "Scanner continuity OK. Optimizer will not restart the paper worker."
          fi
