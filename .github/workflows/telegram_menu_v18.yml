name: SDA Telegram Menu V18

on:
  workflow_dispatch:
  schedule:
    # Run one minute after the scanner cycle so the listener is normally alive
    # while the 5-minute scanner is doing its work.
    - cron: '1-59/5 * * * *'

permissions:
  contents: write

concurrency:
  group: sda-telegram-menu
  cancel-in-progress: false

jobs:
  listen:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      CHAT_ID: ${{ secrets.CHAT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Listen for Telegram menu callbacks
        run: python telegram_dashboard.py --listen

      - name: Commit Telegram menu state
        run: |
          git config user.name 'sda-telegram-bot'
          git config user.email 'telegram@github.local'
          git add telegram_menu_state.json
          if git diff --staged --quiet; then
            echo 'No Telegram menu state changes.'
          else
            git commit -m 'Update Telegram menu state'
            git push origin main
          fi
