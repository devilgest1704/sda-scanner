name: PAPER Champion vs Challenger Optimizer

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/paper_optimizer.yml'
      - 'tools/paper_optimizer.py'
      - 'tools/paper_research_dataset.py'
      - 'paper_champion_config.py'
      - 'paper_swing_sell_v2.py'
      - 'paper_optimizer_view.py'
      - 'tests/test_paper_optimizer.py'
      - 'tests/test_paper_swing_sell_v2.py'
      - 'tools/lane_research.py'
      - 'tests/test_lane_research.py'

permissions:
  contents: write

concurrency:
  group: paper-champion-optimizer
  cancel-in-progress: false

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      REAL_TRADING_ENABLED: "false"
      REAL_TRADING_DRY_RUN: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install requests

      - name: Test PAPER Swing SELL V2 parity and optimizer gates
        run: |
          python -m py_compile paper_swing_sell_v2.py paper_champion_config.py paper_optimizer_view.py tools/paper_optimizer.py tools/paper_research_dataset.py tools/lane_research.py
          python -m unittest discover -s tests -p 'test_paper_swing_sell_v2.py' -v
          python -m unittest discover -s tests -p 'test_paper_optimizer.py' -v
          python -m unittest discover -s tests -p 'test_lane_research.py' -v

      - name: Run PAPER optimizer (PAPER only, never REAL)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python -m tools.paper_optimizer

      - name: Persist report and PAPER champion config
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          git config user.name 'sda-scanner-bot'
          git config user.email 'scanner@github.local'
          # The scanner checkpoint owns strategy_lab/paper_paths; this job owns only these files.
          git add -f strategy_lab/paper_optimizer_report.json strategy_lab/paper_optimizer_state.json
          if [ -f paper_champion_config.json ]; then git add -f paper_champion_config.json; fi
          if git diff --staged --quiet; then
            echo 'No optimizer changes to commit.'
            exit 0
          fi
          config_changed=false
          if ! git diff --staged --quiet -- paper_champion_config.json; then
            config_changed=true
          fi
          base_config_blob="$(git rev-parse HEAD:paper_champion_config.json 2>/dev/null || echo none)"
          git commit -m 'Update PAPER champion optimizer report'
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "PAPER optimizer persisted on attempt $attempt"
              exit 0
            fi
            git fetch origin main
            if [ "$config_changed" = "true" ]; then
              remote_config_blob="$(git rev-parse origin/main:paper_champion_config.json 2>/dev/null || echo none)"
              if [ "$remote_config_blob" != "$base_config_blob" ]; then
                echo "::error::PAPER champion changed concurrently; refusing stale promotion/rollback."
                exit 1
              fi
            fi
            if ! git rebase origin/main; then
              git rebase --abort || true
              if [ "$config_changed" = "true" ]; then
                echo "::error::PAPER champion change could not be reconciled safely."
                exit 1
              fi
              echo "::warning::Newer optimizer report exists on main; skipping stale commit."
              exit 0
            fi
            sleep 2
          done
          echo "::error::Could not persist PAPER optimizer output."
          exit 1
